services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: kiwi
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwi-local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi -d kiwi"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - kiwi-service-postgres:/var/lib/postgresql/data

volumes:
  kiwi-service-postgres:
