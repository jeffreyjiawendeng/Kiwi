<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The Kiwi mark: a slice of the fruit. Skin, flesh, the ring of seeds, and the pale core.
       Source for build/icon.ico, the website, and BrandMark.tsx; see scripts/icon.mjs. -->
  <defs>
    <radialGradient id="flesh" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#b9e07a"/>
      <stop offset="0.55" stop-color="#7fb945"/>
      <stop offset="1" stop-color="#4f8a2b"/>
    </radialGradient>
    <radialGradient id="core" cx="46%" cy="42%" r="60%">
      <stop offset="0" stop-color="#fbfbe9"/>
      <stop offset="1" stop-color="#e6efc4"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="#6a4b2a"/>
  <circle cx="128" cy="128" r="110" fill="url(#flesh)"/>
  <g fill="#1d1a12">
    <ellipse cx="128" cy="62" rx="5" ry="9"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(30 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(60 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(90 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(120 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(150 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(180 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(210 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(240 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(270 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(300 128 128)"/>
    <ellipse cx="128" cy="62" rx="5" ry="9" transform="rotate(330 128 128)"/>
  </g>
  <circle cx="128" cy="128" r="40" fill="url(#core)"/>
</svg>
