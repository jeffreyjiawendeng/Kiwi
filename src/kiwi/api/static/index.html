<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiwi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script>
    // Applied before first paint. Reading the stored theme after load
    // flashes white on every navigation in dark mode.
    (function () {
      var stored = localStorage.getItem("kiwi-theme") || "system";
      var dark = stored === "dark" ||
        (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.density =
        localStorage.getItem("kiwi-density") || "compact";
    })();
  </script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">Kiwi</div>
      <button id="project-name" class="topbar-project" hidden></button>
      <div id="topbar-spacer"></div>
      <button id="search-btn" class="btn-quiet" title="Go to file (Ctrl+P)">Go to file…</button>
      <button id="theme-btn" class="btn-quiet" title="Theme"></button>
    </header>

    <div id="body">
      <nav id="activitybar" aria-label="Activity">
        <button class="activity" id="menu-btn" title="Menu" aria-haspopup="true">
          <span class="activity__icon" data-icon="menu"></span>
        </button>
        <div class="activity-sep"></div>
        <button class="activity" data-view="explorer" title="Explorer">
          <span class="activity__icon" data-icon="explorer"></span>
        </button>
        <button class="activity" data-view="search" title="Search in project">
          <span class="activity__icon" data-icon="search"></span>
        </button>
        <button class="activity" data-view="review" title="Review">
          <span class="activity__icon" data-icon="review"></span>
          <span class="activity__badge" id="badge-review" hidden></span>
        </button>
        <button class="activity" data-view="references" title="References">
          <span class="activity__icon" data-icon="references"></span>
          <span class="activity__badge" id="badge-references" hidden></span>
        </button>
        <div class="activity-spacer"></div>
        <button class="activity" data-opens="project-settings" title="Project settings">
          <span class="activity__icon" data-icon="gear"></span>
        </button>
        <button class="activity" data-opens="user-settings" title="User settings">
          <span class="activity__icon" data-icon="person"></span>
        </button>
      </nav>

      <aside id="panel-left" class="panel">
        <header class="panel__head">
          <span class="panel__title" id="left-title"></span>
          <span class="panel__actions" id="left-actions"></span>
        </header>
        <div class="panel__body" id="left-body"></div>
      </aside>
      <div class="resizer" id="resize-left" role="separator" aria-orientation="vertical"></div>

      <main id="center" class="panel panel--tabbed">
        <header class="panel__head tabstrip">
          <div class="tabs" id="tabs"></div>
          <span class="panel__actions">
            <button class="btn-quiet icon-btn" id="tab-prev" title="Previous file (Alt+[)">
              <span data-icon="left"></span>
            </button>
            <button class="btn-quiet icon-btn" id="tab-next" title="Next file (Alt+])">
              <span data-icon="right"></span>
            </button>
            <button class="btn-quiet icon-btn" id="tab-menu" title="More" aria-haspopup="true">
              <span data-icon="dots"></span>
            </button>
          </span>
        </header>
        <div class="panel__body" id="center-body"></div>
      </main>

      <div class="resizer" id="resize-right" role="separator" aria-orientation="vertical"></div>
      <aside id="panel-right" class="panel panel--tabbed" hidden>
        <header class="panel__head tabstrip">
          <div class="tabs" id="ai-tabs"></div>
          <span class="panel__actions">
            <button class="btn-quiet icon-btn" id="ai-close" title="Close panel">
              <span data-icon="close"></span>
            </button>
          </span>
        </header>
        <div class="panel__body" id="ai-body"></div>
      </aside>
    </div>

    <footer id="statusbar">
      <span id="status-left"></span>
      <span id="status-progress"></span>
      <div id="statusbar-spacer"></div>
      <span id="status-right" aria-live="polite"></span>
    </footer>
  </div>

  <div id="error-stack" aria-live="assertive"></div>
  <div id="overlay" hidden></div>
  <div id="menu-layer" hidden></div>
  <input type="file" id="paper-file-input" accept="application/pdf" multiple hidden />
  <input type="file" id="page-file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
