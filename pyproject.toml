[project]
name = "kiwi"
version = "1.7.0"
description = "An open research workspace with verifiable retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "typer>=0.15",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    # The Store, and the BM25 index inside it. Needed by every install:
    # what the extras add is models, not storage.
    "lancedb>=0.20",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.4", "einops>=0.8"]
generate = ["litellm>=1.60"]
align = ["transformers>=4.48", "torch>=2.5"]

[project.scripts]
kiwi = "kiwi.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    # Renders the web interface. Install its browser with:
    #   uv run playwright install chromium
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiwi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"kiwi.components".msg = "protocols.py must not import implementations"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# The banned-api rule above exists to keep the interface layer
# (protocols.py) from importing implementations. Every other module is
# expected to import kiwi.components; that is how they get used.
"!src/kiwi/protocols.py" = ["TID251"]
# A one-off authoring script: long lines are verbatim quotes copied from
# real papers, not code, and wrapping them would make them harder to
# compare against source. See eval/README.md.
"eval/_build_golden.py" = ["E501", "B007"]

[tool.mypy]
strict = true
files = ["src/kiwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_grobid: needs a running GROBID service",
    "requires_network: calls an external API",
    "slow: takes over a second",
    "requires_browser: renders the web interface in headless Chromium",
]
